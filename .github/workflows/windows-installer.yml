name: Windows installer

# Builds HTorrent-Setup-<version>.exe on every push to main (as a downloadable artifact),
# on demand, and for v* tags, where it is also attached to a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'HTorrent/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: HTorrent/HTorrentCompose
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NSIS
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
            if (-not (Test-Path "$nsisDir\makensis.exe")) { choco install nsis -y --no-progress }
            Add-Content $env:GITHUB_PATH $nsisDir
          }

      - name: Read app version
        id: version
        run: |
          $line = ./gradlew.bat properties -q --console=plain | Select-String '^version: '
          $version = "$line".Substring(9).Trim()
          "value=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in build.gradle.kts. Bump the version (build.gradle.kts, launcher csproj, window title) before tagging."
          }

      - name: Test
        run: ./gradlew.bat test --console=plain

      - name: Build installer
        run: ./gradlew.bat packageInstaller --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: HTorrent-Setup-${{ steps.version.outputs.value }}
          path: HTorrent/HTorrentCompose/build/installer/HTorrent-Setup-*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HTorrent/HTorrentCompose/build/installer/HTorrent-Setup-*.exe
          generate_release_notes: true
