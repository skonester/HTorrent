name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'VERSION'
      - 'HTorrent/**'
      - 'android/**'
      - 'extension/**'
      - 'native/**'
      - 'scripts/**'
      - 'LICENSE'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must contain a numeric major.minor.patch version."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match v$VERSION from VERSION."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: HTorrent/HTorrentCompose
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install NSIS
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
            if (-not (Test-Path "$nsisDir\makensis.exe")) { choco install nsis -y --no-progress }
            Add-Content $env:GITHUB_PATH $nsisDir
          }

      - name: Test
        run: ./gradlew.bat test --console=plain

      - name: Build installer
        run: ./gradlew.bat packageInstaller --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop
          path: HTorrent/HTorrentCompose/build/installer/HTorrent-Setup-${{ needs.version.outputs.value }}.exe
          if-no-files-found: error

  extension:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Test
        working-directory: extension
        run: node --test

      - name: Build release ZIP
        run: python3 scripts/build-extension.py

      - name: Check the scripts parse
        run: |
          for f in background helpers content popup; do
            cp "build/extension-chrome/$f.js" "$RUNNER_TEMP/$f.mjs"
            node --check "$RUNNER_TEMP/$f.mjs"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-extension
          path: build/HTorrent-Extension-Chrome-${{ needs.version.outputs.value }}.zip
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-24.04
    # The first run builds libtorrent, Boost and OpenSSL for both ARM ABIs; later runs reuse the cache.
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Native build tools
        timeout-minutes: 15
        run: |
          for try in 1 2 3; do
            timeout 300 sudo apt-get update -qq && timeout 400 sudo apt-get install -y -qq ninja-build pkg-config autoconf automake libtool && exit 0
            sleep 20
          done
          exit 1

      - name: Restore the torrent engine's build cache
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .native-cache/installed
            .native-cache/binaries
            .native-cache/vcpkg/downloads
          key: native-android-${{ hashFiles('native/vcpkg.json', 'native/triplets/**', 'native/src/**', 'native/include/**') }}
          restore-keys: native-android-

      - name: Build the torrent engine
        run: bash scripts/android-torrent-libs.sh arm64 arm

      # Save a complete native build before running the app build, which can fail independently.
      - name: Save the torrent engine's build cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .native-cache/installed
            .native-cache/binaries
            .native-cache/vcpkg/downloads
          key: native-android-${{ hashFiles('native/vcpkg.json', 'native/triplets/**', 'native/src/**', 'native/include/**') }}

      - name: Check the engine matches the app's package
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            so="android/app/src/main/jniLibs/$abi/libnexonic_torrent.so"
            for fn in create call destroy; do
              grep -qa "Java_com_htorrent_mobile_torrent_NativeTorrent_$fn" "$so" || { echo "$so does not export $fn"; exit 1; }
            done
          done

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Stay on v5: v6 requires accepting Gradle's proprietary Terms of Use for its caching component.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Test
        run: gradle -p android --no-daemon testDebugUnitTest

      # Debug APKs are installable without a private release keystore; keep their package/name explicit.
      - name: Build the debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Check and stage the APK
        run: |
          mkdir -p out
          APK="out/HTorrent-Android-$VERSION-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -E "^package|^application-label:|native-code"
          echo "$BADGING" | grep -q "name='com.htorrent.mobile.debug'"
          echo "$BADGING" | grep -q "versionName='$VERSION-debug'"
          for abi in arm64-v8a armeabi-v7a; do
            unzip -p "$APK" "lib/$abi/libnexonic_torrent.so" > /dev/null
          done
          unzip -p "$APK" assets/licenses/NOTICES.txt > /dev/null
          unzip -p "$APK" assets/licenses/MIT-Nexonic.txt > /dev/null
          unzip -p "$APK" assets/licenses/Torrent-engine-NOTICES.txt > /dev/null
          sha256sum "$APK"

      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: android/app/build/reports
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: out/HTorrent-Android-${{ needs.version.outputs.value }}-debug.apk
          if-no-files-found: error

  android-sources:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Collect the Android video engine's source archives
        run: bash scripts/android-gpl-sources.sh out

      - uses: actions/upload-artifact@v7
        with:
          name: release-android-sources
          path: out/Android-GPL-Sources.tar.gz
          if-no-files-found: error

  release:
    needs: [version, desktop, extension, android, android-sources]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify release assets and generate checksums
        working-directory: release
        run: |
          test -s "HTorrent-Setup-$VERSION.exe"
          test -s "HTorrent-Extension-Chrome-$VERSION.zip"
          test -s "HTorrent-Android-$VERSION-debug.apk"
          test -s Android-GPL-Sources.tar.gz
          sha256sum *.exe *.zip *.apk *.tar.gz > SHA256SUMS.txt

      # Preserve the existing main-branch release behavior, with one tag update after all builds succeed.
      # Tags pushed with GITHUB_TOKEN do not start another workflow run.
      - name: Point release tag at this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f "v$VERSION" "$GITHUB_SHA"
          git push -f origin "refs/tags/v$VERSION"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: HTorrent ${{ needs.version.outputs.value }}
          files: |
            release/HTorrent-Setup-${{ needs.version.outputs.value }}.exe
            release/HTorrent-Extension-Chrome-${{ needs.version.outputs.value }}.zip
            release/HTorrent-Android-${{ needs.version.outputs.value }}-debug.apk
            release/Android-GPL-Sources.tar.gz
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
          generate_release_notes: true
