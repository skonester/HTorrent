<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #fff; --fg: #1d1d1f; --muted: #6b7280; --line: #e5e7eb; --accent: #2563EB; --ok: #1a7f37; --bad: #cf222e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1f22; --fg: #ececec; --muted: #9ca3af; --line: #33363b; --accent: #60A5FA; --ok: #3fb950; --bad: #f85149; } }
  body { font: 13px system-ui, -apple-system, sans-serif; width: 360px; margin: 0; padding: 12px; color: var(--fg); background: var(--bg); }
  h1 { font-size: 14px; margin: 0 0 6px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
  [hidden] { display: none !important; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; gap: 8px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 5px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; }
  button:disabled { opacity: .5; cursor: default; }
  button { padding: 5px 10px; border: 0; border-radius: 5px; background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
  button.plain { background: transparent; color: var(--accent); padding: 2px 4px; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 170px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
  li { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { color: var(--muted); font-size: 12px; }
  .ok { color: var(--ok); font-size: 12px; }
  .bad { color: var(--bad); font-size: 12px; }
</style>
</head>
<body>
  <h1>HTorrent</h1>
  <div class="row"><span id="status" class="muted">Checking the app…</span><button id="open">Open HTorrent</button></div>
  <div class="row"><input type="text" id="link" placeholder="Paste a magnet or .torrent link"><button id="send">Add</button></div>

  <h2>Torrents on this page</h2>
  <div class="row"><span id="found" class="muted">Looks for magnet links and .torrent files.</span><button id="find">Find</button></div>
  <ul id="links" hidden></ul>
  <div class="row" id="linkActions" hidden>
    <span><button class="plain" id="all">All</button><button class="plain" id="none">None</button></span>
    <button id="add">Add to HTorrent</button>
  </div>

  <h2>Settings</h2>
  <div class="row"><label for="enabled">Send clicked magnet links and downloaded .torrent files to HTorrent</label><input type="checkbox" id="enabled"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
